<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuoDex · 悬浮徽记</title>
  <link rel="stylesheet" href="gallery.css">
  <script defer src="titanium.js"></script>
  <script defer src="waveguide.js"></script>
  <script defer src="enamel.js"></script>
  <script defer src="gallery.js"></script>
</head>
<body>
  <main id="gallery">
    <header>
      <div><span class="wordmark">QuoDex</span><h1>悬浮徽记</h1></div>
      <div class="view-controls">
        <button id="sizing" type="button" aria-pressed="false">查看 29 px 实寸</button>
        <button id="lighting" type="button" aria-pressed="false">切换浅色桌面</button>
      </div>
    </header>
    <div class="engraving layout" aria-hidden="true">
      <span>材质</span><span>Codex</span><span>ZCode</span><span>Gemini</span><span>窄条 · 实际尺寸</span>
    </div>
    <section id="specimens" aria-label="三套任务徽记"></section>
    <footer><div class="states" role="group" aria-label="实尺寸任务状态"></div>
      <span>右侧为 25 px 徽记，搭配 260 px 双舷窗窄条。</span>
    </footer>
  </main>
</body>
</html>
