<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuoDex · 任务栏设计</title><link rel="stylesheet" href="optics.css"><script defer src="optics.js"></script></head>
<body><main>
<header><div class="mast"><span class="brand">QuoDex</span><span class="slash">/</span><h1>任务栏设计</h1></div><p>同一组示例聊天 · 已通过的 Gemini 三仓浮窗</p></header>
<nav aria-label="预览设置"><div class="switch" aria-label="浮窗宽度"><button data-width="300" aria-pressed="true">300 px</button><button data-width="260" aria-pressed="false">260 px</button></div>
<label>场景 <select id="scene"><option value="normal">七项聊天</option><option value="busy">任务拥挤</option><option value="partial">网页未连接</option><option value="offline">Gemini 离线</option><option value="empty">全部空闲</option></select></label>
<label class="scale"><input type="checkbox" id="large" checked> 放大看材质</label></nav>
<div class="gallery">
<article id="prism"><div class="paper"><div class="stage"></div></div><div class="caption"><div><i>D</i><h2>汇流棱镜</h2></div><p>沿三条光纤读来源，点右侧棱镜集中看报错和等待。</p></div></article>
<article id="dial"><div class="paper"><div class="stage"></div></div><div class="caption"><div><i>E</i><h2>偏心星盘</h2></div><p>星盘分三区点亮任务。切换来源，右侧铭牌直接读任务名。</p></div></article>
<article id="drop"><div class="paper"><div class="stage"></div></div><div class="caption"><div><i>F</i><h2>悬滴</h2></div><p>一滴对应一段聊天。点水滴看详情，点横梁上的名字看整组。</p></div></article>
</div><footer><span>示例状态</span><span><b class="ink-run">›</b>运行中</span><span><b class="ink-wait">Ⅱ</b>等待操作</span><span><b class="ink-fail">!</b>执行报错</span><span><b class="ink-done">✓</b>已完成</span></footer></main>
<dialog id="detail"><div class="detail-head"><h2></h2><button type="button" id="close" aria-label="关闭详情">×</button></div><div class="entries"></div></dialog>
</body></html>
