<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuoDex · 额度轮播来源</title>
<link rel="stylesheet" href="../../../src/SettingsDock.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef1f1;color:#19303b;font-family:"Segoe UI Variable","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button,input{font:inherit}
  button{cursor:pointer}
  .board{width:min(1040px,100%);margin:0 auto;padding:27px 26px 22px;background:#f6f8f7}
  .intro{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding-bottom:19px;border-bottom:1px solid #c3cdd0}
  h1,h2,p{margin:0}
  h1{font-size:26px;line-height:1.3;font-weight:630;letter-spacing:.01em}
  .intro small{color:#48606a;font-size:13px}
  .columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  article h2{font-size:18px;line-height:1.3;font-weight:600;display:flex;align-items:baseline;gap:9px;margin:20px 0 12px}
  .letter{font-family:"Segoe UI",sans-serif;color:#426575;font-weight:650;font-size:15px}
  .recommended{font-size:12px;font-weight:500;color:#366758}
  .desk{display:grid;place-items:center;padding:12px 0;min-height:290px;overflow:hidden;background:linear-gradient(128deg,#243943 0%,#435660 60%,#303e48 100%);border:1px solid #53646b;border-radius:6px}
  .note{font-size:14px;line-height:1.7;color:#455c65;padding:12px 2px 0}
  .native{width:300px;position:relative;display:flex;justify-content:center;align-items:center}
  .native.small{width:260px}
  .window{width:600px;flex:none;zoom:.5;color:#effaff;--cyan:#50d8ff;--ease-out-expo:cubic-bezier(.16,1,.3,1)}
  .small .window{width:520px}
  .window .settings-dock{position:relative;inset:auto;width:auto;height:auto;margin:0 28px}
  .small .window .settings-dock{margin:0 10px}
  .window .dock-controls{height:auto;min-height:404px;gap:8px}
  .dock-liquid-shell::after{animation:none}
  .window button:hover{filter:brightness(1.14)}
  .window button:focus-visible{outline:3px solid #bceafa;outline-offset:1px}
  .window .dock-sources .glass-lens{padding-inline:4px;gap:6px}
  .window .dock-sources .lens-state-dot{width:13px;height:13px;flex:none}
  .chooser,.choices,.mode,.summary,.list-head,.list,.feedback{position:relative;z-index:2}
  .chooser{display:grid;gap:6px;padding:2px 0 7px}
  .label,.list-head{color:#d4e6ec;font-size:21px;font-weight:550}
  .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .choice,.mode button,.summary,.back,.list button{color:#d8e5eb;background:transparent;border:0;text-shadow:inherit}
  .choice{display:flex;align-items:center;justify-content:center;gap:7px;height:47px;min-width:0;font-size:22px;font-weight:560;border-radius:9px}
  .choice[aria-checked=true]{color:#effbff;background:linear-gradient(0deg,#5eacba14,#c0e8f515);box-shadow:inset 0 -1px #adddeb4d}
  .box{display:inline-grid;place-items:center;flex:none;width:21px;height:21px;border:2px solid #95a7af;border-radius:5px;background:#142d36}
  [aria-checked=true]>.box{background:linear-gradient(#c2e6e9,#83bec9);border-color:#bee7ed}
  [aria-checked=true]>.box:after{content:"";width:10px;height:5px;border:solid #10343e;border-width:0 0 3px 3px;transform:translateY(-1px) rotate(-45deg)}
  .mode{display:flex;gap:6px;padding:5px 0 10px;border-bottom:1px solid #9dced163}
  .mode button{width:50%;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:550}
  .mode button[aria-pressed=true]{color:#fff;background:url("../../../src/droplet-surface.svg") center/100% 100% no-repeat}
  .summary,.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:0 5px;font-size:22px}
  .summary strong{font-size:21px;color:#eafaff}
  .summary .edit,.back{color:#b9e8eb;font-size:21px}
  .list-head{padding:4px 0 10px;min-height:60px;border-bottom:1px solid #9dced163}
  .back{padding:6px 2px}
  .list{display:grid}
  .list button{display:flex;align-items:center;justify-content:space-between;min-height:61px;padding:0 14px;border-bottom:1px solid #a6d2dc33;font-size:24px;font-weight:530}
  .list button[aria-checked=true]{color:#f3fcff}
  .feedback{font-size:19px;line-height:1.4;color:#f2cf95}
  .feedback:empty{display:none}
  .editor .dock-controls{min-height:404px}
  .editor .dock-footer {margin-top:auto}
  .compact-board{width:min(680px,100%);margin:24px auto}
  .compact-board .columns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compact-board .desk{min-height:280px}
  @media(max-width:940px){.board:not(.compact-board) .columns{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.board:not(.compact-board) .desk{min-height:270px}}
  @media(max-width:630px){.board{padding:16px 12px}.intro{display:block}.intro small{display:block;margin-top:8px}.compact-board .columns{grid-template-columns:1fr}}
</style>
<main id="options" class="board">
  <header class="intro"><h1>轮播哪些 Agent 的额度</h1><small>默认三项全选 · 图中仅选 Codex 与 Gemini</small></header>
  <div class="columns">
    <article><h2><span class="letter">A</span>就地展开 <span class="recommended">推荐</span></h2><div class="desk" data-design="a"></div><p class="note">点「轮播」，在原入口下方直接勾选。</p></article>
    <article><h2><span class="letter">B</span>固定 / 轮播</h2><div class="desk" data-design="b"></div><p class="note">先选显示模式，再在同一排选择 Agent。</p></article>
    <article><h2><span class="letter">C</span>独立清单</h2><div class="desk" data-design="c" data-editor></div><p class="note">点轮播摘要旁的「编辑」，进入三行清单。</p></article>
  </div>
</main>
<section id="compact" class="board compact-board">
  <header class="intro"><h1>A · 就地展开</h1><small>按窗口实际宽度对照</small></header>
  <div class="columns"><article><h2>300 px · 标准浮窗</h2><div class="desk" data-design="a"></div></article>
  <article><h2>260 px · 窄条</h2><div class="desk" data-design="a" data-small></div></article></div>
</section>
<template id="native-settings"><aside class="settings-dock" role="dialog" aria-label="显示设置"><div class="dock-controls dock-controls--simple" data-save-state="idle"><div class="dock-liquid-shell" aria-hidden="true"></div><div class="dock-sources" role="group" aria-label="额度来源"><button type="button" class="glass-lens glass-lens--codex" data-glass-lens="true" data-lens-tone="codex" data-selected="false" aria-pressed="false"><span class="lens-state-dot" aria-hidden="true"></span><span>Codex</span></button><button type="button" class="glass-lens glass-lens--zcode" data-glass-lens="true" data-lens-tone="zcode" data-selected="false" aria-pressed="false"><span class="lens-state-dot" aria-hidden="true"></span><span>ZCode</span></button><button type="button" class="glass-lens glass-lens--gemini" data-glass-lens="true" data-lens-tone="gemini" data-selected="false" aria-pressed="false"><span class="lens-state-dot" aria-hidden="true"></span><span>Gemini</span></button><button type="button" class="glass-lens glass-lens--carousel" data-glass-lens="true" data-lens-tone="carousel" data-selected="true" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m10-4a8 8 0 0 0-13-2m-1 10a8 8 0 0 0 13 2"></path></svg><span>轮播</span></button></div><div class="dock-shortcuts"><button class="dock-layout" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l5 5M20 4l-5 5M4 20l5-5M20 20l-5-5M5 9h4V5m10 4h-4V5M5 15h4v4m10-4h-4v4"></path></svg>收起为窄条</button><button class="dock-usage" type="button" data-entry-state="idle" aria-busy="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 17v-5m6 5V5m6 12V9"></path></svg><span class="dock-usage-label">用量统计</span><span class="dock-usage-hint" role="status"><span class="dock-sr-only">默认浏览器</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-9 9m7 0v7H4V6h7"></path></svg></span></button></div><div class="dock-preferences dock-preferences--simple"><label class="dock-opacity" for="dock-opacity"><span>背景透明度</span><output for="dock-opacity">8%</output><input id="dock-opacity" aria-label="背景透明度" type="range" min="0" max="0.8" step="0.02" style="--range-fill:9.999999999999995%" value="0.08"/></label></div><div class="dock-actions"><label class="dock-motion dock-pin" title="开启后保持窗口置顶"><span>置于顶层</span><input type="checkbox" checked=""/><span class="dock-switch" aria-hidden="true"></span></label><label class="dock-motion"><span>减少动效</span><input type="checkbox"/><span class="dock-switch" aria-hidden="true"></span></label></div><div class="dock-footer"><button class="dock-details-toggle" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C9 7 6 10 6 14a6 6 0 0 0 12 0c0-4-3-7-6-11Z"></path></svg>详情</button><span class="dock-info"><span class="dock-save-state" role="status"></span><span class="dock-version">v0.4.12</span></span><button class="dock-quit" type="button" aria-label="退出应用"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7 5.5a8 8 0 1 0 10 0"></path></svg>退出</button><button class="dock-collapse" type="button" aria-label="关闭设置" title="收起设置 · Esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button></div></div></aside></template>
<script>
  const agents=["Codex","ZCode","Gemini"];
  const sourceKeys=["codex","zcode","gemini","carousel"];
  for(const desk of document.querySelectorAll(".desk")){
    const kind=desk.dataset.design;
    const chosen=new Set(["Codex","Gemini"]);
    let current="carousel", fixed="Codex", editing=desk.hasAttribute("data-editor");
    const native=document.createElement("div");
    native.className="native"+(desk.hasAttribute("data-small")?" small app-frame--collapsed":"");
    native.innerHTML='<div class="window"></div>';
    desk.append(native);
    function draw(message=""){
      const frame=native.firstElementChild;
      frame.replaceChildren(document.getElementById("native-settings").content.cloneNode(true));
      const dock=frame.querySelector(".dock-controls");
      const rail=dock.querySelector(".dock-sources");
      const secondary=[...dock.children].filter(node=>!node.matches(".dock-liquid-shell,.dock-sources,.dock-footer"));
      native.classList.toggle("editor",kind==="c"&&editing);
      let insertion=rail;
      function add(className,tag="div"){
        const el=document.createElement(tag);el.className=className;insertion.after(el);insertion=el;return el;
      }
      function action(text,callback){
        const b=document.createElement("button");b.type="button";b.textContent=text;
        b.addEventListener("click",callback);return b;
      }
      function redrawFocus(selector,notice=""){
        draw(notice);frame.querySelector(selector)?.focus({preventScroll:true});
      }
      function setMode(key){
        current=key;if(key!=="carousel")fixed=agents[sourceKeys.indexOf(key)];
        editing=false;redrawFocus('[data-mode="'+(kind==="b"?(key==="carousel"?"carousel":"fixed"):key)+'"]');
      }
      function toggle(name){
        const selector='[data-agent="'+name+'"]';
        if(chosen.has(name)&&chosen.size===2){redrawFocus(selector,"轮播至少选择两个 Agent");return;}
        chosen.has(name)?chosen.delete(name):chosen.add(name);redrawFocus(selector);
      }
      function agentButton(name,isList=false){
        const b=action(name,()=>current==="carousel"?toggle(name):setMode(name.toLowerCase()));
        b.dataset.agent=name;b.className=isList?"":"choice";
        b.setAttribute("role",current==="carousel"?"checkbox":"radio");
        b.setAttribute("aria-checked",current==="carousel"?chosen.has(name):name===fixed);
        const box=document.createElement("span");box.className="box";box.setAttribute("aria-hidden","true");
        isList?b.append(box):b.prepend(box);
        return b;
      }
      if(kind==="b"){
        const mode=add("mode");rail.remove();
        for(const [key,title] of [["fixed","固定"],["carousel","轮播"]]){
          const b=action(title,()=>setMode(key==="fixed"?fixed.toLowerCase():key));b.dataset.mode=key;
          b.setAttribute("aria-pressed",key==="carousel"?current==="carousel":current!=="carousel");mode.append(b);
        }
        const row=add("choices");row.setAttribute("aria-label","额度来源");agents.forEach(n=>row.append(agentButton(n)));
      }else{
        [...rail.children].forEach((b,i)=>{
          const key=sourceKeys[i];b.dataset.mode=key;b.dataset.selected=String(current===key);b.setAttribute("aria-pressed",current===key);
          b.addEventListener("click",()=>setMode(key));
        });
        if(current==="carousel"&&kind==="a"){
          const chooser=add("chooser");chooser.innerHTML='<span class="label">轮播来源</span><div class="choices" role="group" aria-label="轮播来源"></div>';
          agents.forEach(n=>chooser.lastElementChild.append(agentButton(n)));
        }
        if(current==="carousel"&&kind==="c"){
          if(editing){
            const head=add("list-head");rail.remove();head.innerHTML="<strong>轮播来源</strong>";
            const back=action("‹ 返回",()=>{editing=false;redrawFocus(".summary")});back.className="back";head.append(back);
            const list=add("list");list.setAttribute("role","group");list.setAttribute("aria-label","轮播来源");agents.forEach(n=>list.append(agentButton(n,true)));
            secondary.forEach(n=>n.remove());dock.querySelector(".dock-footer").remove();
          }else{
            const row=add("summary","button");row.type="button";
            row.innerHTML="<strong>"+agents.filter(n=>chosen.has(n)).join(" · ")+'</strong><span class="edit">编辑 ›</span>';
            row.addEventListener("click",()=>{editing=true;redrawFocus(".back")});
          }
        }
      }
      const feedback=add("feedback");feedback.setAttribute("role","status");feedback.textContent=message;
      if(desk.hasAttribute("data-small")){const layout=dock.querySelector(".dock-layout");if(layout)layout.lastChild.textContent="恢复标准视图"}
      for(const el of dock.querySelectorAll(".dock-footer,.dock-shortcuts,.dock-actions,.dock-preferences"))el.inert=true;
    }
    draw();
  }
</script>
</html>
