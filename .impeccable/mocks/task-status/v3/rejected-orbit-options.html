<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuoDex · 任务圈 V3 动效方案</title>
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",sans-serif;color:#edfaff;background:#0a1722;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:34px 40px 28px;max-width:1220px;margin-inline:auto}
h1{font-size:26px;font-weight:650;margin:0 0 12px}p{margin:0;color:#b9d9e7;font-size:14px;line-height:1.7}
.toolbar{display:flex;gap:10px;margin:20px 0 26px;align-items:center;flex-wrap:wrap}button{font:inherit;font-size:13px;padding:8px 15px;border:1px solid #355668;border-radius:7px;background:#173340;color:#edfaff;cursor:pointer}button:focus-visible{outline:2px solid #50d8ff;outline-offset:3px}.toolbar span{font-size:12px;color:#b9d9e7}
.directions{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:32px}article{min-width:0;border-top:1px solid #355668;padding-top:18px}h2{font-size:19px;margin:0 0 6px;font-weight:650}.recommend{color:#65edb8;font-size:12px;margin-left:10px}.description{min-height:50px;font-size:13px}
.magnified{display:flex;justify-content:center;gap:24px;align-items:center;height:150px;background:#13222f;border-radius:9px;margin-top:16px}.magnified .icon{width:92px;height:92px;filter:drop-shadow(0 3px 6px #001019)}
.actual{width:300px;margin:18px auto 0;background:#13222f}.row{height:36px;display:flex;align-items:center;justify-content:center;gap:6.6px}.icon{width:20.4px;height:20.4px;display:block;overflow:visible;flex-shrink:0}.slot{width:27px;height:28px;display:grid;place-items:center}.row{gap:0}.actual img{display:block;width:300px;height:130px}.scale{margin-top:9px;font-size:12px;text-align:center;color:#b9d9e7}.summary{margin-top:15px;padding-top:12px;border-top:1px solid #243e4e;font-size:13px}.summary strong{color:#edfaff}
.comparison{margin-top:30px;border-top:1px solid #355668;padding-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.comparison h3{font-size:16px;margin:0 0 12px}.compare-strip{display:flex;gap:18px;align-items:center}.compare-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#b9d9e7}.success-zoom{display:flex;gap:18px;align-items:center}.success-zoom .icon{width:70px;height:70px}.success-zoom p{font-size:13px}.light{padding:12px 20px;background:#d8e6ee;border-radius:8px;display:flex;gap:16px;align-items:center;justify-content:center;color:#122a38}.light .icon{width:20.4px;height:20.4px}
svg{fill:none;stroke-linecap:round;stroke-linejoin:round}.rim{stroke:#50d8ff;stroke-width:2.4;fill:#071723}.base{opacity:.62}.orbit{transform-origin:20.4px 20.4px;animation:turn 2.6s linear infinite}.reverse{animation:turn-back 4.2s linear infinite}.trace{stroke:#b8f7ff;stroke-width:2.8}.faint{stroke:#50d8ff;opacity:.35}.core{fill:#b8f7ff;stroke:none;animation:core-breath 1.8s ease-in-out infinite}.pulse-ring{stroke:#50d8ff;stroke-width:1.1;transform-origin:20.4px 20.4px;animation:energy 1.8s ease-out infinite}.segment{stroke:#50d8ff;stroke-width:2.4;stroke-dasharray:12 5;opacity:.66}.scan{stroke:#dcfcff;stroke-width:2.5;stroke-dasharray:17 93;animation:scan 2.4s linear infinite}.scan-back{stroke:#50d8ff;stroke-width:1.7;stroke-dasharray:12 64;animation:scan-back 3.7s linear infinite}.crosshair{stroke:#50d8ff;opacity:.65;stroke-width:1.2}.blades{transform-origin:20.4px 20.4px;animation:turn 3.4s linear infinite;stroke:#aef6ff;stroke-width:2;fill:#1a6473;fill-opacity:.35}.blade-trail{stroke:#50d8ff;stroke-width:1.2;opacity:.5;transform-origin:20.4px 20.4px;animation:turn-back 5.2s linear infinite}.surface-pulse{fill:url(#core-light);animation:core-breath 2.2s ease-in-out infinite}
.success .rim{stroke:#65edb8}.success .check{stroke:#65edb8;stroke-width:2.8}.success text{stroke:none;fill:#65edb8;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}.old .rim{stroke-width:2}.old text{stroke:none;fill:#65edb8;font-size:17px;font-weight:650}.old .check{stroke:#65edb8;stroke-width:2.6}.old.icon{width:24px;height:24px}.pause-icon .rim{stroke:#ffd27a}.pause-icon path{stroke:#ffd27a;stroke-width:2.8}.failed .rim{stroke:#ff897e}.failed path{stroke:#ff897e;stroke-width:2.8}.unknown .rim{stroke:#c4d6e1;stroke-dasharray:4 3}.unknown path{stroke:#c4d6e1;stroke-width:2.8}
.reduce .orbit,.reduce .reverse,.reduce .scan,.reduce .scan-back,.reduce .blades,.reduce .blade-trail{animation:none}.reduce .core{animation:gentle 2.4s ease-in-out infinite}.reduce .pulse-ring{animation:none;opacity:.25}.reduce .surface-pulse{animation:gentle 2.4s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}@keyframes turn-back{to{transform:rotate(-360deg)}}@keyframes core-breath{0%,100%{opacity:.95}50%{opacity:.4}}@keyframes energy{0%{transform:scale(.45);opacity:.85}85%,100%{transform:scale(1.1);opacity:0}}@keyframes scan{to{stroke-dashoffset:-110}}@keyframes scan-back{to{stroke-dashoffset:76}}@keyframes gentle{0%,100%{opacity:1}50%{opacity:.78}}
@media(max-width:1040px){body{padding:24px}.directions{grid-template-columns:1fr}.description{min-height:0}.magnified{max-width:500px}.comparison{grid-template-columns:1fr}.actual{margin-inline:0}}
@media(prefers-reduced-motion:reduce){.orbit,.reverse,.scan,.scan-back,.blades,.blade-trail{animation:none}.core,.surface-pulse{animation:gentle 2.4s ease-in-out infinite}.pulse-ring{animation:none;opacity:.25}}
</style>
<h1>QuoDex 任务圈 · V3 动效方案</h1>
<p>直径减少 15%：24 → 20.4px；边框增粗 20%：1 → 1.2px。完成勾与分钟重新排版，三个方向使用相同尺寸。</p>
<div class="toolbar"><button id="motion">暂停动效</button><button id="reduce" aria-pressed="false">查看减少动效</button><span>设计预览 · 演示任务 · 下方驾驶舱为现有产物截图 · 尚未写入应用</span></div>
<main class="directions" id="directions"></main>
<section class="comparison"><div><h3>完成时间留白</h3><div class="success-zoom" id="success-zoom"></div><div class="compare-strip" id="compare-strip"></div></div><div><h3>浅色桌面上的实际尺寸</h3><div class="light" id="light"></div><p style="margin-top:10px">保留深色圆心衬底，轮廓稳定。扫描层与边框分离，运行不再只是整圈忽明忽暗。</p></div></section>
<p style="margin-top:22px;font-size:12px">参考：<a href="https://github.com/DavidHDev/react-bits">React Bits</a> 的反向轨道；<a href="https://github.com/DavidHDev/canvas-ui">Canvas UI</a> 的局部能量层次。此预览使用自行绘制的 SVG / CSS，不导入其组件。原生透景范围延续 <a href="https://github.com/tauri-apps/window-vibrancy">window-vibrancy</a> 参考。</p>
<script>
const rim='<circle class="rim base" cx="20.4" cy="20.4" r="19.2"/>';
const defs='<defs><radialGradient id="core-light"><stop stop-color="#59e9ff" stop-opacity=".42"/><stop offset="1" stop-color="#59e9ff" stop-opacity="0"/></radialGradient></defs>';
function svg(body,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 40.8 40.8" aria-hidden="true">${body}</svg>`;}
function run(kind){
 if(kind==='a')return svg(rim+'<circle class="faint" cx="20.4" cy="20.4" r="13" stroke-width="1" stroke-dasharray="2 4"/><g class="orbit"><path class="trace" d="M20.4 2.2a18.2 18.2 0 0 1 17.3 12.7"/><circle cx="37.7" cy="14.9" r="1.8" fill="#edfdff" stroke="none"/><path d="M20.4 2.2a18.2 18.2 0 0 0-12.8 5.3" stroke="#50d8ff" stroke-width="2.4" opacity=".65"/></g><g class="orbit reverse"><path d="M20.4 8.4a12 12 0 0 1 10.4 6" stroke="#50d8ff" stroke-width="1.6"/><path d="M20.4 32.4a12 12 0 0 1-10.4-6" stroke="#50d8ff" stroke-width="1.6"/></g><circle class="pulse-ring" cx="20.4" cy="20.4" r="7"/><circle class="core" cx="20.4" cy="20.4" r="2.3"/>');
 if(kind==='b')return svg(rim+'<circle class="segment" cx="20.4" cy="20.4" r="17.5"/><circle class="scan" cx="20.4" cy="20.4" r="17.5"/><circle class="scan-back" cx="20.4" cy="20.4" r="12.1"/><path class="crosshair" d="M20.4 12v4m0 8.8v4M12 20.4h4m8.8 0h4"/><circle class="core" cx="20.4" cy="20.4" r="1.6"/>');
 return svg(defs+rim+'<circle class="surface-pulse" cx="20.4" cy="20.4" r="16"/><g class="blades"><path d="M20.4 9.2c7 0 11.2 4.2 11.2 11.2l-7.2-4.1z"/><path d="M31.6 20.4c-3.5 6.1-9.2 7.6-15.3 4.1l7.2-4.1z"/><path d="M16.3 24.5c-3.5-6.1-2-11.8 4.1-15.3v8.2z"/></g><g class="blade-trail"><path d="M20.4 4.9a15.5 15.5 0 0 1 13.4 7.8m0 15.4a15.5 15.5 0 0 1-26.8 0"/></g><circle class="core" cx="20.4" cy="20.4" r="2.2"/>');
}
function success(time='10m'){return svg('<circle class="rim" cx="20.4" cy="20.4" r="19.2"/><path class="check" d="m5 12 4 4 10-10" transform="translate(10.8 3.5) scale(.8)"/><text x="20.4" y="29.8" text-anchor="middle">'+time+'</text>','success');}
const old='<svg class="icon old" viewBox="0 0 48 48" aria-hidden="true"><circle class="rim" cx="24" cy="24" r="23"/><path class="check" d="m5 12 4 4 10-10" transform="translate(12 2.5)"/><text x="24" y="39" text-anchor="middle">29m</text></svg>';
const options=[{id:'a',title:'A · 双轨扫描',recommended:true,description:'外轨扫光带白色光头，内轨反向转动；中心轻微能量脉冲。',summary:'<strong>推荐</strong>：像驾驶舱中的实时传感器，小尺寸也能看出内外层次。'},{id:'b',title:'B · 分段追踪',description:'分段外环顺序扫亮，内圈反向追踪；中心保留精细准星。',summary:'仪表感更强，节奏克制；更接近工程终端的状态指示。'},{id:'c',title:'C · 能量转子',description:'三叶转子持续旋转，反向弧轨围绕中心；能量光面缓慢呼吸。',summary:'视觉活动更明显，机械能量感最强；圆心的存在感更高。'}];
document.querySelector('#directions').innerHTML=options.map(option=>`<article><h2>${option.title}${option.recommended?'<span class="recommend">推荐</span>':''}</h2><p class="description">${option.description}</p><div class="magnified">${run(option.id)}${success()}</div><div class="actual"><div class="row"><span class="slot">${run(option.id)}</span><span class="slot">${run(option.id)}</span><span class="slot">${success()}</span></div><img src="/cockpit.png" alt="现有 QuoDex 额度驾驶舱原生截图"></div><p class="scale">实际浮窗宽度 300px · 圈直径 20.4px</p><p class="summary">${option.summary}</p></article>`).join('');
document.querySelector('#success-zoom').innerHTML=success('29m')+'<p>勾位于上部，分钟基线向圆心收回。<br>字号 7px；用 <strong>29m</strong> 核对较宽的两位数字。<br>底部与两侧均留出独立空间。</p>';
document.querySelector('#compare-strip').innerHTML='<span class="compare-item">原版'+old+'</span><span class="compare-item">调整后'+success('29m')+'</span>';
document.querySelector('#light').innerHTML=options.map(option=>run(option.id)).join('')+success('29m');
let paused=false;
document.querySelector('#motion').onclick=event=>{paused=!paused;document.getAnimations().forEach(animation=>paused?animation.pause():animation.play());event.currentTarget.textContent=paused?'播放动效':'暂停动效';};
document.querySelector('#reduce').onclick=event=>{const reduced=document.body.classList.toggle('reduce');event.currentTarget.setAttribute('aria-pressed',String(reduced));event.currentTarget.textContent=reduced?'恢复完整动效':'查看减少动效';};
</script>
</html>
